services:

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: development
    ports:
      - "8080:8080"
    expose:
      - "8080"
    volumes:
      - ./frontend/src:/app/src

  user-service-db:
    container_name: user-service-db
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=user_service_db
    ports:
      - '5432:5432'
    volumes:
      - ./config/postgres/user-service-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - '5001:3000'
    environment:
      - USER_SERVICE_DB_HOST=user-service-db
      - USER_SERVICE_DB_PORT=5432
      - USER_SERVICE_DB_NAME=user_service_db
      - USER_SERVICE_DB_USER=admin
      - USER_SERVICE_DB_PASSWORD=password
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      user-service-db:
        condition: service_healthy

  order-service-db:
    container_name: order-service-db
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=order_service_db
    ports:
      - '5433:5432'
    volumes:
      - ./config/postgres/order-service-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d order_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    container_name: order-service
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - '5002:3000'
    environment:
      - USER_SERVICE_URL=http://user-service:3000
      - PAYMENT_SERVICE_URL=http://payment-service:3000
      - ORDER_SERVICE_DB_HOST=order-service-db
      - ORDER_SERVICE_DB_PORT=5432
      - ORDER_SERVICE_DB_NAME=order_service_db
      - ORDER_SERVICE_DB_USER=admin
      - ORDER_SERVICE_DB_PASSWORD=password
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      order-service-db:
        condition: service_healthy

  payment-service:
    container_name: payment-service
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    ports:
      - '5003:3000'
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318

  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor traceQLStreaming metricsSummary
    ports:
      - "3000:3000"

  tempo:
    image: grafana/tempo:2.6.1
    command: "--config.file=/etc/tempo.yaml"
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.1.0
    command: "--config.file=/etc/prometheus.yaml"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    command: [ --config=/etc/otel-collector-config.yaml ]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
    depends_on:
      - prometheus
      - tempo
      - loki
      - grafana
      - promtail
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5

  socat:
     image: bpack/socat
     command: TCP4-LISTEN:2375,fork,reuseaddr UNIX-CONNECT:/var/run/docker.sock
     volumes:
        - /var/run/docker.sock:/var/run/docker.sock
     expose:
        - "2375"

  promtail:
    image: grafana/promtail:3.3.2
    command: [ -config.file=/etc/promtail.yaml ]
    volumes:
      - ./config/promtail.yaml:/etc/promtail.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3101:3101
